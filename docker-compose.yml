version: "3.9"

services:
  api:
    build: .
    ports:
      - "3003:3003"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/pmserver
      - SECRET_KEY=change-me-in-production
      - PORT=3003
      - NODE_ENV=development
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - mongo
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
