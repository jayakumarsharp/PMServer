name: CI — Build & Deploy Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: syntax + dependency check ────────────────────────────────────
  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install backend dependencies
        run: yarn install --frozen-lockfile

      - name: Babel compile check (no runtime errors)
        run: yarn babel index.js --out-file /dev/null --presets @babel/preset-env
        continue-on-error: true

  # ── Frontend: TypeScript + Next.js build ──────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3003' }}

  # ── Deploy status notification ─────────────────────────────────────────────
  notify:
    name: Deploy Status
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: All checks passed
        run: |
          echo "✅ Backend and frontend checks passed on main."
          echo "Railway and Vercel will now auto-deploy from GitHub."
          echo "Backend:  https://your-app.up.railway.app"
          echo "Frontend: https://your-app.vercel.app"
